version: 2
updates:
  # The workflows pin third-party actions to exact commits; this keeps those
  # pins current. A one-week cooldown leaves time for a compromised release to
  # be caught before it is proposed here.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
